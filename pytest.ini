[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -v
markers =
    functional: Functional test cases
    validation: Validation test cases
    negative: Negative test cases
    crud: CRUD test cases
    ui: UI/UX test cases
    regression: Regression test suite
